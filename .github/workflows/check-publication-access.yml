name: Verificar acesso de publicação do Fama
on:
  push:
    branches: [codex/verify-cloudflare-publication-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Conferir credenciais e acesso aos Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const names = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID'];
          const missing = names.filter(name => !process.env[name]);
          if (missing.length) {
            console.error('::error::Configuração de publicação ausente: ' + missing.join(', '));
            process.exit(1);
          }
          const account = encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID);
          for (const worker of ['fama-system-app', 'fama-control-app']) {
            const response = await fetch('https://api.cloudflare.com/client/v4/accounts/' + account + '/workers/scripts/' + worker + '/deployments', {
              headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN },
              signal: AbortSignal.timeout(20000),
            });
            const result = await response.json();
            if (!response.ok || !result.success) {
              console.error('::error::Acesso de publicação recusado para ' + worker + ' (HTTP ' + response.status + ').');
              process.exit(1);
            }
            console.log('Acesso de leitura confirmado para ' + worker + '.');
          }
          console.log('Credenciais disponíveis para preparar a publicação conjunta.');
          JS
