name: Gerar APKs de teste Android
on:
  push:
    branches: ['android/apk-test-20261121']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # This disposable CI key is never used for distribution and is not uploaded.
      WATER_ANDROID_KEYSTORE_PASSWORD: ci-only-temporary
      WATER_ANDROID_KEY_ALIAS: water-ci-test
      WATER_ANDROID_KEY_PASSWORD: ci-only-temporary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar caminho temporário
        run: echo "WATER_ANDROID_KEYSTORE=$RUNNER_TEMP/water-signing-ci.jks" >> "$GITHUB_ENV"
      - name: Criar chave descartável para o teste
        run: |
          keytool -genkeypair -keyalg RSA -keysize 2048 -validity 2 \
            -alias "$WATER_ANDROID_KEY_ALIAS" -keystore "$WATER_ANDROID_KEYSTORE" \
            -storepass:env WATER_ANDROID_KEYSTORE_PASSWORD -keypass:env WATER_ANDROID_KEY_PASSWORD \
            -dname 'CN=Water CI Test' -noprompt
      - name: Gerar APK e AAB de teste assinados
        working-directory: apps/android
        run: |
          gradle --no-daemon :app:assembleSystemRelease :app:assembleControlRelease \
            :app:bundleSystemRelease :app:bundleControlRelease
      - name: Verificar assinaturas
        run: |
          for apk in apps/android/app/build/outputs/apk/*/release/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
          for bundle in apps/android/app/build/outputs/bundle/*Release/*.aab; do
            jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/bundle-verification.txt"
            grep -q 'jar verified' "$RUNNER_TEMP/bundle-verification.txt"
          done
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar os aplicativos
        working-directory: apps/android
        run: gradle --no-daemon :app:assembleSystemDebug :app:assembleControlDebug
      - name: Verificar os pacotes
        run: |
          mkdir -p android-artifacts
          cp apps/android/app/build/outputs/apk/system/debug/app-system-debug.apk android-artifacts/Water-System-teste.apk
          cp apps/android/app/build/outputs/apk/control/debug/app-control-debug.apk android-artifacts/Water-Control-teste.apk
          for apk in android-artifacts/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1,4p'
          done
          sha256sum android-artifacts/*.apk > android-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: water-android-test-apks
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 7
  smoke-test:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: water-android-test-apks
          path: android-artifacts
      - name: Habilitar aceleração do Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e abrir em Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/android/smoke-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-android-test-screens
          path: android-test-screens/
          if-no-files-found: ignore
          retention-days: 7
