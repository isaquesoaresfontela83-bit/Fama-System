<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061329"><title>Fama System</title><style>html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#061329;color:#edf7ff}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{width:min(460px,100%);padding:28px;border:1px solid #21486f;border-radius:22px;background:#0c2444;box-sizing:border-box}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:#fff;color:#0a5c9f;font-weight:1000;font-size:22px}h1{margin:18px 0 8px;font-size:28px}p{color:#91abc5;line-height:1.5}.spin{display:inline-block;width:16px;height:16px;border:2px solid #4e708f;border-top-color:#66d9f2;border-radius:50%;animation:s .8s linear infinite;margin-right:8px;vertical-align:-3px}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:10px;padding:11px 14px;background:#1686d5;color:#fff;font-weight:800;cursor:pointer}</style></head><body><main><section class="box"><div class="mark">FP</div><h1>Fama System</h1><p id="status"><span class="spin"></span>Carregando sistema...</p><button id="retry" hidden>Carregar novamente</button></section></main><script>(()=>{const SOURCE='https://mupnsdqahoybhmkpufmx.supabase.co/functions/v1/fama-frontend-source?app=system';const status=document.getElementById('status'),retry=document.getElementById('retry');async function boot(){retry.hidden=true;status.innerHTML='<span class="spin"></span>Carregando sistema...';try{const r=await fetch(SOURCE,{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok||!j.html)throw new Error(j.message||'Falha ao carregar o Fama System.');document.open();document.write(j.html);document.close()}catch(e){status.textContent=e.message||'Não foi possível abrir o Fama System.';retry.hidden=false}}retry.onclick=boot;boot()})();</script></body></html>
